<style>
  :root {
    --text: #101418;
    --secondary: #5B6672;
    --bg: #FAFAF7;

    --positive: #0E7C66;
    --risk: #C2410C;
    --divider: #E3E0D8;
    --surface: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16pt;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 28px 64px; }

  /* ---------- Header ---------- */
  .page-head { border-bottom: 1px solid var(--divider); padding-bottom: 24px; margin-bottom: 36px; }
  h1 { font-size: 28pt; font-weight: 700; letter-spacing: -0.4px; margin: 0 0 10px; line-height: 1.15; }
  .timestamp { font-size: 14pt; color: var(--secondary); margin: 0; }
  .run-meta { font-size: 14pt; color: var(--secondary); margin: 6px 0 0; }

  h2 {
    font-size: 20pt; font-weight: 600; letter-spacing: -0.2px;
    margin: 0 0 18px;
  }

  /* ---------- Agent cards ---------- */
  .agents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 44px; }
  .agent-card {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 10px;
    padding: 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .agent-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .agent-name { font-size: 16pt; font-weight: 600; line-height: 1.3; }
  .agent-job { font-size: 14pt; color: var(--secondary); margin: 0; }
  .agent-status {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--positive); font-size: 14pt; font-weight: 600;
    flex: none;
  }

  /* ---------- Theme cards ---------- */
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .theme-card {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 10px;
    padding: 20px;
    display: flex; flex-direction: column;
  }
  .theme-name { font-size: 17pt; font-weight: 600; line-height: 1.28; margin: 0 0 8px; }
  .theme-desc { font-size: 14pt; color: var(--secondary); margin: 0 0 14px; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent);
    color: var(--text);
    font-size: 14pt; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .badge-quiet {
    background: transparent;
    border: 1px solid var(--divider);
    color: var(--secondary);
    font-weight: 500;
  }

  .snippet {
    border-left: 2px solid var(--divider);
    padding: 2px 0 2px 12px;
    margin: 0 0 10px;
    font-size: 14pt;
    color: var(--secondary);
  }
  .snippet-meta { display: block; margin-top: 4px; font-size: 14pt; color: var(--secondary); opacity: 0.8; }

  details.evidence { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--divider); }
  details.evidence > summary {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; list-style: none;
    font-size: 14pt; font-weight: 600; color: var(--text);
  }
  details.evidence > summary::-webkit-details-marker { display: none; }
  details.evidence > summary:focus-visible { outline: 2px solid var(--positive); outline-offset: 3px; border-radius: 4px; }
  details.evidence[open] .chev { transform: rotate(180deg); }
  .chev { transition: transform 0.15s ease; flex: none; }
  .id-list {
    margin: 12px 0 0; padding: 0; list-style: none;
    display: flex; flex-wrap: wrap; gap: 6px;
    max-height: 180px; overflow-y: auto;
  }
  .id-list li {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14pt;
    color: var(--secondary);
    background: var(--bg);
    border: 1px solid var(--divider);
    border-radius: 5px;
    padding: 1px 7px;
  }

  /* ---------- Footer ---------- */
  .validator {
    margin-top: 44px; padding-top: 24px;
    border-top: 1px solid var(--divider);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .validator-body { flex: 1; }
  .validator-line { font-size: 16pt; font-weight: 600; margin: 0; }
  .validator-note { font-size: 14pt; color: var(--secondary); margin: 6px 0 0; }
  .ok { color: var(--positive); }
  .flag { color: var(--risk); }

  .empty {
    border: 1px dashed var(--divider); border-radius: 10px;
    padding: 28px; text-align: center; color: var(--secondary); font-size: 16pt;
  }

  @media (max-width: 860px) {
    .agents { grid-template-columns: 1fr; }
    .wrap { padding: 28px 18px 48px; }
    h1 { font-size: 24pt; }
  }
</style>

    chevron: ['m6 9 6 6 6-6'],
    shield:  ['M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z', 'm9 12 2 2 4-4'],
    alert:   ['m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3', 'M12 9v4', 'M12 17h.01'],
    tag:     ['M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z', 'M7 7h.01'],
    users:   ['M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2', 'M22 21v-2a4 4 0 0 0-3-3.87', 'M16 3.13a4 4 0 0 1 0 7.75'],
    bulb:    ['M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5a6 6 0 0 0-12 0c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5', 'M9 18h6', 'M10 22h4']
  };
  var CIRCLES = { users: [{ cx: 9, cy: 7, r: 4 }] };

  function icon(name, size, cls) {
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    if (cls) svg.setAttribute('class', cls);
    (ICONS[name] || []).forEach(function (d) {
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      svg.appendChild(p);
    });
    (CIRCLES[name] || []).forEach(function (c) {
      var el = document.createElementNS(NS, 'circle');
      el.setAttribute('cx', c.cx); el.setAttribute('cy', c.cy); el.setAttribute('r', c.r);
      svg.appendChild(el);
    });
    return svg;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text; // textContent, never innerHTML — review text is untrusted
    return n;
  }

  var AGENTS = [
    { name: 'Theme Agent', icon: 'tag',   job: 'Names the recurring pattern inside each review cluster.' },
    { name: 'JTBD & Segment Agent', icon: 'users', job: 'Infers who the user is and the job they are trying to get done.' },
    { name: 'Opportunity Agent', icon: 'bulb',  job: 'Turns the theme into a scored product opportunity.' }
  ];

  function readPayload() {
    var node = document.getElementById('extraction-data');
    var raw = (node && node.textContent || '')
      .replace('/* DATA:START */', '')
      .replace('/* DATA:END */', '')
      .trim();
    if (raw && raw !== 'null') {
      try { return Promise.resolve(JSON.parse(raw)); } catch (e) { /* fall through to fetch */ }
    }
    // Not inlined (or malformed) — try the sibling file. Works when served
    // over http; on file:// this rejects and we show the empty state.
    return fetch('./data.json').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function fmtTimestamp(iso) {
    if (!iso) return 'Run timestamp unavailable';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleString(undefined, {
      day: 'numeric', month: 'long', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function renderAgents() {
    var host = document.getElementById('agents');
    AGENTS.forEach(function (a) {
      var card = el('div', 'agent-card');
      var top = el('div', 'agent-top');

      var left = el('div');
      var nameRow = el('div', 'agent-name');
      nameRow.appendChild(icon(a.icon, 17));
      nameRow.appendChild(document.createTextNode(' ' + a.name));
      left.appendChild(nameRow);

      var status = el('span', 'agent-status');
      status.appendChild(icon('check', 16));
      status.appendChild(document.createTextNode('Complete'));

      top.appendChild(left);
      top.appendChild(status);
      card.appendChild(top);
      card.appendChild(el('p', 'agent-job', a.job));
      host.appendChild(card);
    });
  }

  function renderThemes(themes) {
    var host = document.getElementById('themes');
    if (!themes || !themes.length) {
      var e = el('div', 'empty', 'No themes in this run.');
      host.appendChild(e);
      return;
    }

    themes.forEach(function (t) {
      var card = el('div', 'theme-card');
      card.appendChild(el('h3', 'theme-name', t.theme_name));
      if (t.theme_description) card.appendChild(el('p', 'theme-desc', t.theme_description));

      var badges = el('div', 'badges');
      var count = el('span', 'badge');
      count.textContent = t.evidence_count + (t.evidence_count === 1 ? ' review' : ' reviews');
      badges.appendChild(count);

      if (typeof t.prevalence_pct === 'number') {
        badges.appendChild(el('span', 'badge badge-quiet', t.prevalence_pct + '% prevalence'));
      }
      if (t.hallucinated_ids && t.hallucinated_ids.length) {
        var f = el('span', 'badge badge-quiet');
        f.style.color = 'var(--risk)';
        f.style.borderColor = 'var(--risk)';
        f.textContent = t.hallucinated_ids.length + ' flagged ID' + (t.hallucinated_ids.length === 1 ? '' : 's');
        badges.appendChild(f);
      }
      card.appendChild(badges);

      (t.snippets || []).forEach(function (s) {
        var q = el('blockquote', 'snippet');
        q.appendChild(document.createTextNode('“' + s.text + '”'));
        var meta = el('span', 'snippet-meta');
        var bits = [];
        if (s.source) bits.push(s.source);
        if (s.rating != null) bits.push(s.rating + '★');
        bits.push(s.id);
        meta.textContent = bits.join(' · ');
        q.appendChild(meta);
        card.appendChild(q);
      });

      var ids = t.evidence_ids || [];
      var det = el('details', 'evidence');
      var sum = el('summary');
      sum.appendChild(icon('chevron', 15, 'chev'));
      sum.appendChild(document.createTextNode('Evidence IDs (' + ids.length + ')'));
      det.appendChild(sum);
      var ul = el('ul', 'id-list');
      ids.forEach(function (id) { ul.appendChild(el('li', null, id)); });
      det.appendChild(ul);
      card.appendChild(det);

      host.appendChild(card);
    });
  }

  function renderValidator(v, payload) {
    var host = document.getElementById('validator');
    if (!v) return;

    var clean = v.hallucinated_ids_total === 0;
    host.appendChild(icon(clean ? 'shield' : 'alert', 22, clean ? 'ok' : 'flag'));

    var body = el('div', 'validator-body');
    var line = el('p', 'validator-line');
    line.appendChild(document.createTextNode('Evidence Validator: '));

    var passSpan = el('span', v.themes_passed === v.themes_total ? 'ok' : 'flag');
    passSpan.textContent = v.themes_passed + ' of ' + v.themes_total + ' themes passed';
    line.appendChild(passSpan);
    line.appendChild(document.createTextNode(', '));

    var rate = v.hallucination_rate_pct;
    var rateSpan = el('span', clean ? 'ok' : 'flag');
    rateSpan.textContent = (rate == null ? '—' : rate + '%') + ' hallucination';
    line.appendChild(rateSpan);
    body.appendChild(line);

    var note = el('p', 'validator-note');
    var parts = ['Deterministic check — every cited ID is matched against real cluster membership, not graded by a model.'];
    if (payload.corpus_total != null) {
      parts.push('Prevalence is a share of ' + payload.corpus_total.toLocaleString() +
        ' reviews (' + (payload.prevalence_basis || 'basis unlabelled') + ').');
    }
    note.textContent = parts.join(' ');
    body.appendChild(note);
    host.appendChild(body);
  }

  function renderError(msg) {
    document.getElementById('timestamp').textContent = 'Could not load run data';
    var host = document.getElementById('themes');
    host.appendChild(el('div', 'empty',
      'No extraction data available. Run "node results-page/build.mjs", or serve this page alongside data.json. (' + msg + ')'));
  }

  renderAgents();

  readPayload().then(function (payload) {
    document.getElementById('timestamp').textContent = fmtTimestamp(payload.generated_at);

    var meta = [];
    if (payload.total_clusters_processed != null) meta.push(payload.total_clusters_processed + ' clusters processed');
    if (payload.corpus_total != null) meta.push(payload.corpus_total.toLocaleString() + ' reviews analyzed');
    document.getElementById('run-meta').textContent = meta.join(' · ');

    renderThemes(payload.themes);
    renderValidator(payload.validator, payload);
  }).catch(function (err) {
    renderError(err && err.message ? err.message : String(err));
  });
})();
</script>
</body>
</html>
